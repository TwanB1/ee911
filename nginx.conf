# nginx du conteneur du site commercial. TLS, HSTS et en-têtes de sécurité
# sont portés par le reverse proxy de l'infra — ici : servir vite et propre.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css image/svg+xml application/javascript;

    # Assets versionnables : cache long. Le HTML reste court pour que les
    # mises à jour du site soient visibles immédiatement.
    location ~* \.(css|svg|png|jpg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
